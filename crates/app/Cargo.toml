[package]
name = "voxferro"
description = "Voxel editor built on wgpu and egui"
version.workspace = true
edition.workspace = true
license.workspace = true
# rmcp 3.5 needs 1.88; the other crates keep the workspace minimum.
rust-version = "1.88"

[[bin]]
name = "voxferro"
path = "src/main.rs"

[dependencies]
voxel-core = { path = "../voxel-core" }
vox-format = { path = "../vox-format" }
glam.workspace = true
bytemuck.workspace = true

# eframe 0.36 ships wgpu in its default features (glow is not enabled), and
# pulls egui-wgpu 0.36 -> wgpu 30.0.1. Keeping wgpu at "30" here resolves to
# that same version, so the graph holds a single wgpu. Two versions compile
# but produce duplicate types that cannot be assigned to each other.
eframe = "0.36"
egui = "0.36"
wgpu = "30"
# Native open/save panels (NSOpenPanel on macOS). Default features only pull
# Linux portal support, which does not build anything on macOS.
rfd = "0.17"

# Control by MCP (src/mcp.rs): the official Rust SDK, served over
# streamable HTTP with axum on a tokio runtime of its own thread.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Files opened from Finder arrive as an Apple Event (src/macos_open.rs).
# The same objc2 version winit already uses, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
