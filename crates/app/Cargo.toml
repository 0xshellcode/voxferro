[package]
name = "voxferro"
description = "Voxel editor built on wgpu and egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "voxferro"
path = "src/main.rs"

[dependencies]
voxel-core = { path = "../voxel-core" }
vox-format = { path = "../vox-format" }
glam.workspace = true
bytemuck.workspace = true

# eframe 0.36 ships wgpu in its default features (glow is not enabled), and
# pulls egui-wgpu 0.36 -> wgpu 30.0.1. Keeping wgpu at "30" here resolves to
# that same version, so the graph holds a single wgpu. Two versions compile
# but produce duplicate types that cannot be assigned to each other.
eframe = "0.36"
egui = "0.36"
wgpu = "30"
# Voxel scripts (src/xs.rs): GLSL and WGSL scripts are parsed and checked
# here, for errors with line numbers, before wgpu sees them. The version
# wgpu 30 already uses.
naga = { version = "30", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
# Native open/save panels (NSOpenPanel on macOS). Default features only pull
# Linux portal support, which does not build anything on macOS.
rfd = "0.17"

# Icons (src/layout.rs): Phosphor, an MIT icon font, packaged for this egui.
egui-phosphor = "0.14"
# Palette files (src/palette_files.rs): 256x1 PNGs. The version eframe's
# image support already builds.
png = "0.18"
# "Remove project to trash" (src/project.rs): the system's own trash, on
# each platform. Without chrono, which only dates trash listings.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

# Control by MCP (src/mcp.rs): the official Rust SDK, served over
# streamable HTTP with axum on a tokio runtime of its own thread.
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Files opened from Finder arrive as an Apple Event (src/macos_open.rs).
# The same objc2 version winit already uses, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# The icon in the Windows executable (build.rs). Only built on Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Attaching to the console that launched the app (src/main.rs), on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Storage_FileSystem"] }
