[package]
name = "voxel-core"
description = "Voxel volume, scene graph and command stack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
glam.workspace = true
vox-format = { path = "../vox-format" }
# DEFLATE for PNG output: rendered frames are megabytes uncompressed.
miniz_oxide = "0.9"

[dev-dependencies]
# An independent reader, to check that edited scene graphs read the same.
dot_vox = "5"
