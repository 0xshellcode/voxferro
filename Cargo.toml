[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared across crates. Versions verified against crates.io on 2026-10-14.
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.dev]
# Dependencies optimized, our code unoptimized: fast iteration without a
# sluggish viewer. Matters once wgpu and the mesher are in play.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# The voxel core does the heavy CPU work while editing -- meshing, baking the
# traced grid, the atmosphere sky -- and unoptimized it made a sky slider
# drag take 157 ms a frame. Optimized here even in dev builds; the app crate
# stays at opt-level 0 so it still rebuilds quickly.
[profile.dev.package.voxel-core]
opt-level = 2

