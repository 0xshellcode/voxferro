[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Shared across crates. Versions verified against crates.io on 2026-10-14.
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.dev]
# Dependencies optimized, our code unoptimized: fast iteration without a
# sluggish viewer. Matters once wgpu and the mesher are in play.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
