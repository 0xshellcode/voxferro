# A release: pushing a tag like v0.1.0 builds Voxferro for macOS (one
# universal binary, Apple silicon and Intel), Windows and Linux, and publishes a GitHub Release with the
# packages and install notes. The tag must match the workspace version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (it must exist)"
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag against the version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match the workspace version $version" >&2
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh --universal
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p target/dist
          ditto -c -k --keepParent target/Voxferro.app "target/dist/Voxferro-$version-macos-universal.zip"
          # The disk image, laid out with its background and arrow.
          brew install create-dmg
          ./scripts/make-dmg.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -WithDxc

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            target/dist/Voxferro-*.zip
            target/dist/Voxferro-*.dmg
            target/dist/*.tar.gz
            target/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ls -la dist
          gh release create "$tag" dist/* --title "Voxferro $tag" --notes-file .github/release-notes.md --verify-tag
