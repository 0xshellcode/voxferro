# Build, lint and test on every push to master, on Linux and Windows.
# macOS (whose runner minutes count ten times in a private repo) runs only
# when started by hand: Actions > CI > Run workflow.
name: CI

on:
  push:
    branches: [master]
    # Documentation and images alone do not need a build.
    paths-ignore:
      - "**.md"
      - "assets/showcase/**"
      - "assets/icon/*.png"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run on macOS"
        type: boolean
        default: true
      package:
        description: "Build the Linux tarball and the Windows zip"
        type: boolean
        default: false

# A newer push replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # macOS only on a manual run that asks for it.
          - os: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos) && 'none' || 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # What eframe/winit link against on Linux (X11 and Wayland).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
          # A software GPU (lavapipe, Vulkan) and a virtual display, for the
          # smoke tests below.
          sudo apt-get install -y mesa-vulkan-drivers xvfb libxkbcommon-x11-0

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Builds the app too (on Windows, build.rs embeds the icon). The
      # the reference editor sample corpus is not in git; tests that need it skip.
      - name: Tests
        run: cargo test --workspace

      # `cargo test` builds the test harness, not the binary itself.
      - name: Build the app
        run: cargo build -p voxferro

      # The app itself, run for real. CI machines have no GPU: Linux uses
      # lavapipe (Vulkan in software) under a virtual X display, Windows
      # WARP (DirectX 12 in software); macOS runners have Metal.
      - name: Smoke test, editor view
        shell: bash
        timeout-minutes: 10
        env:
          VOXFERRO_NO_RECENT: "1"
        run: |
          run=""; if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          py=python3; if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          $run ./target/debug/voxferro --script assets/showcase/shapes.cmds --screenshot view.bmp 2>&1 | tee view.log
          $py scripts/ci/check_image.py view.bmp

      # Windows renders through DirectX 12 with DXC (src/windows_graphics.rs);
      # the runner's Windows SDK has the DLLs.
      - name: DXC next to the binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir=$(dirname "$(find "/c/Program Files (x86)/Windows Kits/10/bin" -path "*x64/dxcompiler.dll" | sort | tail -1)")
          cp "$dir/dxcompiler.dll" "$dir/dxil.dll" target/debug/

      - name: Smoke test, path traced render
        shell: bash
        timeout-minutes: 15
        env:
          VOXFERRO_NO_RECENT: "1"
        run: |
          run=""; if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          py=python3; if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          $run ./target/debug/voxferro --script assets/showcase/shapes.cmds --render 8 --screenshot smoke.bmp 2>&1 | tee smoke.log
          grep "graphics backend" smoke.log
          if [ "$RUNNER_OS" = Windows ]; then grep "graphics: DirectX 12 with DXC" smoke.log; fi
          $py scripts/ci/check_image.py smoke.bmp

      - name: Smoke test, MCP session
        shell: bash
        timeout-minutes: 15
        env:
          VOXFERRO_NO_RECENT: "1"
        run: |
          run=""; if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          py=python3; if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          $run ./target/debug/voxferro --mcp > mcp.log 2>&1 &
          app=$!
          $py scripts/ci/mcp_smoke.py
          kill $app || true

      - name: Smoke test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: |
            view.bmp
            view.log
            smoke.bmp
            smoke.log
            mcp.log
          if-no-files-found: ignore

      # Packages, on a manual run that asks for them.
      - name: Package (Linux)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.package
        run: ./scripts/package-linux.sh

      - name: Package (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -WithDxc

      - name: Upload packages
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            target/dist/*.tar.gz
            target/dist/Voxferro-*.zip
            target/dist/*.AppImage
          if-no-files-found: ignore

